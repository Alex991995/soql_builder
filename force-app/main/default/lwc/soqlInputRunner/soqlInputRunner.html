<template>
  <lightning-textarea
    value={valueText}
    rows="20"
    type="text"
    label="Enter or modify a SOQL query below:"
    onchange={handleValueChange}
  ></lightning-textarea>
  <div class="slds-m-top_medium">
    <lightning-button
      variant="brand"
      label="Query"
      title="Primary action"
      onclick={handleQueryClick}
      disabled={isNotFieldNameSelected}
    ></lightning-button>
  </div>

  <template lwc:if={isNotInitialRequest}>
    <template lwc:if={loading}>
      <div class="slds-align_absolute-center">
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
      </div>
    </template>
    <template lwc:elseif={isDataReady}>
      <div class="slds-m-top_x-small">
        <lightning-datatable key-field="id" data={data} columns={columns}>
        </lightning-datatable>
      </div>
    </template>
    <template lwc:elseif={isNumberRecordsANumber}>
      <div class="slds-align_absolute-center">
        <p class="slds-text-color_success">Number of records returned: {numberRecords}</p>
      </div>
    </template>
    <template lwc:elseif={recordError}>
      <div class="slds-align_absolute-center">
        <p class="slds-text-color_error">{recordError}</p>
      </div>
    </template>
    <template lwc:else>
      <div class="slds-align_absolute-center">
        <p class="slds-text-color_weak">Sorry, no records returned</p>
      </div>
    </template>
  </template>
</template>
