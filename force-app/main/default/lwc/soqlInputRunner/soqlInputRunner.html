<template>
  <lightning-textarea
    value={valueText}
    rows="20"
    type="text"
    label="Enter or modify a SOQL query below:"
  ></lightning-textarea>
  <div class="slds-m-top_medium">
    <lightning-button
      variant="brand"
      label="Query"
      title="Primary action"
      onclick={handleQueryClick}
    ></lightning-button>
  </div>

  <template lwc:if={columns}>
    <div>
      <lightning-datatable key-field="id" data={data} columns={columns}>
      </lightning-datatable>
    </div>
  </template>
</template>
