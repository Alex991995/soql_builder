<template>
  <div class="slds-grid slds-gutters_medium">
    <div class="slds-col slds-size_2-of-12">
      <lightning-select
        label="Object:"
        value={selectObjName}
        options={nameObjectsOptions}
        onchange={handleObjName}
        required
      ></lightning-select>

      <lightning-select
        label="Fields:"
        value={selectFieldName}
        options={nameFieldsOptions}
        onchange={handleFieldName}
        required
      ></lightning-select>
      <!-- <template lwc:if={nameFields.data}>
        <div class="">
          <template for:each={nameFields.data} for:item="field">
            <div key={field}>{field}</div>
          </template>
        </div>
      </template> -->
    </div>
    <div class="slds-col slds-size_8-of-12">
      <div class="slds-grid">
        <div class="slds-col slds-size_3-of-6">
          <lightning-select
            label="Sort results by:"
            value={selectSortingField}
            options={fieldsForSorting}
            onchange={handleSortingField}
            disabled={isFieldNameSelected}
          ></lightning-select>
          <lightning-select
            label="Filter results by:"
            value={selectFilteringField}
            options={fieldsForSorting}
            onchange={handleFilteringField}
            disabled={isFieldNameSelected}
          ></lightning-select>
        </div>
        <div class="slds-col slds-size_1-of-6">
          <lightning-select
            options={sortingStrategy}
            onchange={handleSortingStrategy}
            disabled={isFieldNameSelected}
          ></lightning-select>
          <lightning-select
            options={filteringOperations}
            onchange={handleFilteringOperation}
            disabled={isFilteringFieldSelected}
          ></lightning-select>
        </div>

        <div class="slds-col slds-size_1-of-6">
          <!-- <lightning-select
            options={sortingStrategy}
            onchange={handleSortingStrategy}
          ></lightning-select> -->
          <lightning-select
            options={nullOptions}
            onchange={handleNull}
            disabled={isFieldNameSelected}
          ></lightning-select>

          <lightning-input
            disabled={isFilteringFieldSelected}
            onchange={handleFilterValueChange}
          ></lightning-input>
        </div>
      </div>
    </div>
  </div>
  <div>
    lwc
    <c-soql-input-runner value-text={soqlQuery}></c-soql-input-runner>
  </div>
</template>
