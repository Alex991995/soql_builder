<template>
    <div class="slds-grid slds-gutters_medium slds-wrap">
      <div class="slds-col slds-small-size_3-of-12 slds-size_12-of-12">
        <lightning-select
          label="Object:"
          value={selectObjName}
          options={nameObjectsOptions}
          onchange={handleObjName}
          required
        ></lightning-select>
        <c-multi-select
          label="Fields:"
          options={nameFieldsOptions}
          onchange={handleFieldNames}
          placeholder="Select fields"
          required
        ></c-multi-select>
      </div>
      <div class="slds-col slds-small-size_9-of-12 slds-size_12-of-12">
        <div class="slds-grid slds-wrap">
          <div class="slds-col slds-large-size_2-of-5 slds-size_1-of-2">
            <lightning-select
              label="Sort results by:"
              value={selectSortingField}
              options={fieldsForSorting}
              onchange={handleSortingField}
              disabled={isFieldNameNotSelected}
            ></lightning-select>
            <lightning-select
              label="Filter results by:"
              value={selectFilteringField}
              options={fieldsForSorting}
              onchange={handleFilteringField}
              disabled={isFieldNameNotSelected}
            ></lightning-select>
          </div>
          <div class="slds-col slds-large-size_1-of-5 slds-var-m-top_x-small  slds-size_1-of-2">
            <div class="select-container">
              <lightning-select
                value={selectSortingStrategy}
                options={sortingStrategy}
                onchange={handleSortingStrategy}
                disabled={isFieldNameNotSelected}
              ></lightning-select>
              <lightning-select
                value={selectFilteringOperation}
                options={filteringOperations}
                onchange={handleFilteringOperation}
                disabled={isFilteringFieldNotSelected}
              ></lightning-select>
            </div>
          </div>
          <div class="slds-col slds-large-size_1-of-5 slds-var-m-top_x-small  slds-size_1-of-2">
            <div class="select-input-container">
              <lightning-select
                value={selectNull}
                options={nullOptions}
                onchange={handleNull}
                disabled={isFieldNameNotSelected}
              ></lightning-select>

              <lightning-input
                value={selectFilterValue}
                disabled={isFilteringFieldNotSelected}
                onchange={handleFilterValueChange}
              ></lightning-input>
            </div>
          </div>
          <div class="slds-col slds-large-size_1-of-5  slds-size_1-of-2">
            <lightning-input 
              type="number"
              label="Max Records:"
              value={selectLimit}
              onchange={handleLimitRecords}
              disabled={isFilteringFieldNotSelected}
            ></lightning-input>

            <lightning-input 
              type="number"
              label="How many skip"
              value={selectOffset}
              onchange={handleOffsetRecords}
              disabled={isFilteringFieldNotSelected}
            ></lightning-input>
          </div>
        </div>
      </div>
    </div>
    <div>
      <c-soql-input-runner
        value-text={soqlQuery}
        is-not-field-name-selected={isFieldNameNotSelected}>
      </c-soql-input-runner>
    </div>
</template>
